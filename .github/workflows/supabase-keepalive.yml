# Prevents the Supabase Free plan from pausing the project for inactivity.
# Makes one tiny read against the REST API every day.
# NOTE: GitHub disables scheduled workflows after 60 days with no repo commits.
# If that happens, re-enable under the repo's Actions tab (or push any commit).

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: https://abhhmurcrmemwvobcfao.supabase.co
          # Public anon key (already in index.html). Stored as a repo secret to keep it out of the workflow file.
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/questions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON")
          echo "HTTP $status"
          cat /tmp/out.json
          [ "$status" = "200" ]

