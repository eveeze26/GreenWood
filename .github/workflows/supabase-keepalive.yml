name: Supabase keepalive

on:
  schedule:
    # four times a day (UTC); GitHub often starts scheduled runs late
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from Supabase
        env:
          SUPABASE_URL: https://abhhmurcrmemwvobcfao.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/questions?select=id&limit=200" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "request $i -> HTTP $code"
            [ "$code" = "200" ] || exit 1
            sleep 20
          done
